spring:
  datasource:
    url: jdbc:h2:file:./data/hotel
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
logging:
  level:
    org.hibernate.SQL: warn
